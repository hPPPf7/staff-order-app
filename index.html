<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>點餐記錄</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f3ef;
      --panel: #ffffff;
      --panel-soft: #fbfaf8;
      --ink: #23211f;
      --muted: #776f66;
      --line: #ded8cf;
      --brand: #b72f2a;
      --brand-dark: #8d201d;
      --green: #19725b;
      --amber: #d68c11;
      --shadow: 0 16px 42px rgba(69, 52, 34, 0.12);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .update-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(35, 33, 31, 0.48);
    }

    .update-overlay[hidden] {
      display: none;
    }

    .update-dialog {
      width: min(440px, 100%);
      border-radius: 8px;
      padding: 22px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .update-dialog h2 {
      margin-bottom: 8px;
      font-size: 22px;
    }

    .update-dialog p {
      color: var(--muted);
      line-height: 1.6;
    }

    .update-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .app {
      height: 100vh;
      display: grid;
      grid-template-columns: minmax(360px, 0.85fr) minmax(460px, 1.15fr);
      gap: 18px;
      padding: 18px;
      overflow: hidden;
    }

    .left,
    .right {
      min-width: 0;
      max-height: calc(100vh - 36px);
      overflow: hidden;
    }

    .left {
      display: grid;
      grid-template-rows: minmax(0, 1fr);
    }

    .right {
      display: grid;
      gap: 14px;
      align-content: start;
      grid-template-rows: minmax(310px, 1fr) auto;
    }

    h2,
    h3,
    p {
      margin: 0;
    }

    .customer-strip {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .customer-input {
      flex: 1;
      min-width: 0;
      height: 52px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 15px;
      background: var(--panel);
      color: var(--ink);
      font-size: 18px;
      outline: none;
    }

    .customer-input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(183, 47, 42, 0.12);
    }

    .primary-btn,
    .secondary-btn,
    .success-btn,
    .danger-btn,
    .ghost-btn {
      min-height: 44px;
      border-radius: 8px;
      padding: 0 16px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
    }

    .primary-btn {
      background: var(--brand);
      color: #fff;
    }

    .primary-btn:active {
      background: var(--brand-dark);
    }

    .secondary-btn {
      background: #efe8de;
      color: #3c332c;
    }

    .success-btn {
      background: var(--green);
      color: #fff;
    }

    .danger-btn {
      background: #f3dfdc;
      color: #9b211e;
    }

    .ghost-btn {
      background: transparent;
      color: var(--muted);
      min-height: 36px;
      padding: 0 10px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-auto-rows: max-content;
      align-content: start;
      align-items: start;
      align-self: end;
      gap: 12px;
    }

    .menu-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      box-shadow: var(--shadow);
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .menu-card.wide {
      grid-column: 1 / -1;
    }

    .menu-card.wide .option-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .menu-title {
      display: flex;
      align-items: baseline;
    }

    .menu-title h2 {
      font-size: 22px;
      line-height: 1.2;
    }

    .option-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .option-btn {
      min-height: 56px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel-soft);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      text-align: left;
    }

    .option-btn strong {
      font-size: 22px;
      line-height: 1.1;
    }

    .option-btn span {
      color: var(--brand);
      margin-left: auto;
      font-size: 22px;
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
    }

    .option-btn:active {
      border-color: var(--brand);
      background: #fff2ee;
      transform: translateY(1px);
    }

    .pending-panel,
    .order-panel,
    .records-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .order-panel {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 310px;
    }

    .pending-panel {
      overflow: hidden;
      border-color: #c74335;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .pending-head {
      padding: 16px;
      background: #b72f2a;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .pending-head h2 {
      font-size: 30px;
      line-height: 1.05;
    }

    .pending-stats {
      text-align: right;
      font-weight: 900;
      line-height: 1.35;
      white-space: nowrap;
    }

    .pending-count {
      font-size: 28px;
    }

    .pending-list {
      display: grid;
      gap: 8px;
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 10px;
      background: #fff9f6;
      align-content: start;
    }

    .pending-card {
      border: 1px solid #e2b2a8;
      border-radius: 8px;
      background: #fff;
      padding: 9px 10px;
      display: grid;
      gap: 7px;
    }

    .pending-card.active {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(183, 47, 42, 0.13);
    }

    .pending-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .pending-name {
      font-size: 16px;
      font-weight: 950;
      line-height: 1.15;
    }

    .pending-time {
      color: var(--muted);
      font-weight: 800;
      font-size: 13px;
      margin-top: 2px;
    }

    .pending-total {
      color: var(--brand);
      font-size: 20px;
      font-weight: 950;
      white-space: nowrap;
    }

    .pending-lines {
      display: grid;
      gap: 4px;
      color: #2f2924;
      font-size: 15px;
      font-weight: 850;
      line-height: 1.25;
    }

    .pending-line {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 0;
      background: transparent;
      border-radius: 0;
    }

    .pending-card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-top: 1px solid #f0d7cf;
      padding-top: 7px;
    }

    .pending-buttons {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
    }

    .pending-button-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .pending-button-group.payments {
      justify-content: flex-end;
    }

    .pending-card-actions .secondary-btn,
    .pending-card-actions .primary-btn,
    .pending-card-actions .success-btn,
    .pending-card-actions .danger-btn {
      min-height: 32px;
      border-radius: 7px;
      padding: 0 10px;
      font-size: 14px;
    }

    .panel-head {
      min-height: 42px;
      padding: 6px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .current-customer {
      color: var(--muted);
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .items {
      flex: 1;
      height: auto;
      min-height: 0;
      max-height: none;
      padding: 8px;
      overflow: auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-auto-rows: minmax(65px, 1fr);
      align-content: start;
      gap: 8px;
    }

    .items .empty {
      grid-column: 1 / -1;
      min-height: 0;
    }

    .empty {
      height: 100%;
      min-height: 220px;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
      padding: 20px;
    }

    .line-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: auto 28px;
      gap: 4px 6px;
      padding: 6px 8px;
      border: 1px solid #eee8df;
      border-radius: 6px;
      background: var(--panel);
      overflow: hidden;
      align-content: center;
    }

    .line-item:last-child {
      border-bottom: 1px solid #eee8df;
    }

    .line-item > div:first-child {
      grid-column: 1 / -1;
      min-width: 0;
    }

    .line-name {
      font-weight: 900;
      font-size: 15px;
      line-height: 1.15;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .line-meta {
      display: none;
    }

    .qty-control {
      display: grid;
      grid-template-columns: 28px 28px 28px;
      align-items: center;
      gap: 3px;
    }

    .qty-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #efe8de;
      color: var(--ink);
      font-size: 18px;
      font-weight: 900;
    }

    .qty {
      text-align: center;
      font-weight: 900;
      font-size: 15px;
    }

    .item-total {
      grid-column: 2;
      color: var(--brand);
      font-weight: 900;
      text-align: right;
      align-self: center;
      white-space: nowrap;
    }

    .total-bar {
      border-top: 1px solid var(--line);
      padding: 10px 14px 12px;
      background: var(--panel-soft);
      border-radius: 0 0 8px 8px;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 8px;
    }

    .total-label {
      color: var(--muted);
      font-weight: 800;
    }

    .total-number {
      color: var(--brand);
      font-size: 30px;
      font-weight: 950;
      line-height: 1;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .records-panel {
      margin-top: 14px;
      overflow: hidden;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 8px;
      background: #eee8df;
    }

    .tab {
      height: 42px;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      font-weight: 900;
    }

    .tab.active {
      background: var(--panel);
      color: var(--ink);
      box-shadow: 0 4px 12px rgba(69, 52, 34, 0.1);
    }

    .clear-history-btn {
      padding: 0 14px;
      border: 1px solid #c74335;
      border-radius: 8px;
      color: #a92824;
      background: #fff;
      font-weight: 900;
    }

    .clear-history-btn:disabled {
      opacity: 0.45;
    }

    .history-summary-actions {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
    }

    .history-summary-actions button {
      height: 38px;
      padding: 0 14px;
      border-radius: 8px;
      font-weight: 900;
      font-size: 14px;
    }

    .archive-btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
    }

    .records {
      display: grid;
      gap: 10px;
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 12px;
    }

    .history-summary {
      position: sticky;
      top: 0;
      z-index: 2;
      border: 2px solid #d9a19a;
      border-radius: 8px;
      background: #fff;
      padding: 12px;
      display: grid;
      gap: 10px;
      box-shadow: 0 6px 16px rgba(69, 52, 34, 0.12);
    }

    .history-summary-top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
    }

    .history-summary-label {
      color: var(--muted);
      font-size: 14px;
      font-weight: 900;
    }

    .history-summary-total {
      color: var(--brand);
      font-size: 28px;
      font-weight: 950;
      line-height: 1;
    }

    .history-summary-meta {
      color: #453d36;
      font-weight: 900;
      white-space: nowrap;
    }

    .history-item-counts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .history-item-count {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel-soft);
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-weight: 850;
    }

    .history-item-count span:first-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-item-count strong {
      color: var(--brand);
      font-size: 18px;
      white-space: nowrap;
    }

    .record {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-soft);
      padding: 12px;
      display: grid;
      gap: 8px;
    }

    .record-main {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .record-name {
      font-size: 18px;
      font-weight: 950;
      line-height: 1.2;
    }

    .record-time {
      color: var(--muted);
      font-weight: 800;
      font-size: 14px;
      margin-top: 3px;
    }

    .status {
      border-radius: 999px;
      padding: 6px 10px;
      font-weight: 900;
      font-size: 13px;
      white-space: nowrap;
    }

    .status.open {
      color: #095b45;
      background: #dcefe8;
    }

    .status.done {
      color: #7b4b05;
      background: #f8e4bb;
    }

    .status.served {
      color: #155e75;
      background: #dff1f5;
    }

    .status.draft {
      color: #4b5563;
      background: #e8eaed;
    }

    .record-lines {
      color: #453d36;
      line-height: 1.45;
      font-weight: 700;
    }

    .record-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-top: 1px solid #e9e1d8;
      padding-top: 8px;
    }

    .record-total {
      color: var(--brand);
      font-size: 20px;
      font-weight: 950;
    }

    .record-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    @media (max-width: 980px) {
      .app {
        height: auto;
        min-height: 100vh;
        grid-template-columns: 1fr;
        overflow: visible;
      }

      body {
        overflow: auto;
      }

      .left,
      .right {
        max-height: none;
        overflow: visible;
      }

      .right {
        min-height: calc(100vh - 36px);
        grid-template-rows: minmax(390px, 1fr) auto;
      }

      .left {
        min-height: calc(100vh - 36px);
        overflow: hidden;
      }

      .order-panel {
        height: 100%;
        min-height: 390px;
      }

      .items {
        height: auto;
        min-height: 0;
        max-height: none;
        grid-auto-rows: minmax(65px, 1fr);
      }
    }

    @media (max-width: 640px) {
      .app {
        padding: 10px;
        gap: 10px;
      }

      .right {
        min-height: calc(100vh - 20px);
      }

      .left {
        min-height: calc(100vh - 20px);
      }

      .customer-strip {
        display: grid;
        grid-template-columns: 1fr;
      }

      .menu-grid,
      .option-grid,
      .actions,
      .pending-card-actions {
        grid-template-columns: 1fr;
      }

      .pending-head,
      .pending-card-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .pending-head h2 {
        font-size: 26px;
      }

      .pending-stats {
        text-align: left;
      }

      .menu-card {
        min-height: 0;
      }

      .record-main,
      .record-bottom {
        align-items: flex-start;
        flex-direction: column;
      }

      .history-summary-top {
        align-items: flex-start;
        flex-direction: column;
      }

      .history-item-counts {
        grid-template-columns: 1fr;
      }

      .record-buttons {
        justify-content: flex-start;
      }

      .pending-buttons {
        width: 100%;
        gap: 10px;
        justify-content: flex-start;
      }

      .pending-button-group,
      .pending-button-group.payments {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="left" aria-label="待出餐與歷史紀錄">
      <section class="pending-panel" aria-label="待出餐訂單">
        <div class="pending-head">
          <div>
            <h2>待出餐</h2>
            <p id="pendingTotalText">目前沒有未給餐訂單</p>
          </div>
          <div class="pending-stats">
            <div class="pending-count" id="pendingCount">0 筆</div>
            <div id="pendingItemsCount">0 份餐點</div>
          </div>
        </div>
        <div class="tabs">
          <button class="tab active" id="openTab" type="button">待出餐</button>
          <button class="tab" id="historyTab" type="button">歷史紀錄</button>
          <button class="tab" id="archiveTab" type="button">封存紀錄</button>
        </div>
        <div class="pending-list" id="pendingList"></div>
        <div class="records" id="records"></div>
        <div class="records" id="archives"></div>
      </section>
    </section>

    <aside class="right" aria-label="點餐與計算">
      <section class="order-panel" aria-label="目前點餐">
        <div class="panel-head">
          <p class="current-customer" id="activeCustomer">尚未選擇</p>
          <button class="ghost-btn" id="clearAllBtn" type="button">清空全部</button>
        </div>
        <div class="items" id="items"></div>
        <div class="total-bar">
          <div class="total-row">
            <span class="total-label">合計</span>
            <span class="total-number" id="total">$0</span>
          </div>
          <div class="actions">
            <button class="secondary-btn" id="saveBtn" type="button">清空目前</button>
            <button class="primary-btn" id="doneBtn" type="button">送出待出餐</button>
          </div>
        </div>
      </section>

      <div class="menu-grid" id="menu"></div>
    </aside>
  </main>

  <div class="update-overlay" id="updateOverlay" role="dialog" aria-modal="true" aria-labelledby="updateTitle" hidden>
    <div class="update-dialog">
      <h2 id="updateTitle">有新的版本</h2>
      <p id="updateMessage">點擊更新以下載最新版點餐助手。</p>
      <div class="update-actions">
        <button class="secondary-btn" id="updateLaterBtn" type="button">稍後</button>
        <button class="primary-btn" id="updateNowBtn" type="button">下載更新</button>
      </div>
    </div>
  </div>

  <script>
    const appVersion = "1.2.16";
    const latestReleaseUrl = "https://api.github.com/repos/hPPPf7/staff-order-app/releases/latest";
    let updateDownloadUrl = "";
    let lastUpdateCheck = 0;

    const menu = [
      {
        title: "豬肉餡餅",
        options: [
          { key: "pie-original", name: "豬肉餡餅", variant: "原味", price: 50 },
          { key: "pie-spicy", name: "豬肉餡餅", variant: "辣味", price: 50 }
        ]
      },
      {
        title: "韭菜盒",
        options: [
          { key: "chive-box", name: "韭菜盒", variant: "", price: 40 }
        ]
      },
      {
        title: "飛碟餅",
        options: [
          { key: "ufo-egg", name: "飛碟餅", variant: "蔥蛋", price: 60 },
          { key: "ufo-meat", name: "飛碟餅", variant: "加肉", price: 70 },
          { key: "ufo-cheese", name: "飛碟餅", variant: "加起司", price: 70 },

    const storageKey = "staff-order-app-v1";

    function compareVersions(left, right) {
      const leftParts = left.replace(/^v/i, "").split(".").map(Number);
      const rightParts = right.replace(/^v/i, "").split(".").map(Number);
      const length = Math.max(leftParts.length, rightParts.length);

      for (let index = 0; index < length; index += 1) {
        const difference = (leftParts[index] || 0) - (rightParts[index] || 0);
        if (difference !== 0) return difference;
      }

      return 0;
    }

    async function checkForUpdates() {
      lastUpdateCheck = Date.now();

      try {
        const response = await fetch(latestReleaseUrl, {
          cache: "no-store",
          headers: { Accept: "application/vnd.github+json" }
        });
        if (!response.ok) return;

        const release = await response.json();
        const latestVersion = String(release.tag_name || "").replace(/^v/i, "");
        if (!latestVersion || compareVersions(latestVersion, appVersion) <= 0) return;

        const apk = Array.isArray(release.assets)
          ? release.assets.find(asset => asset.name === "staff-order-app.apk")
          : null;
        updateDownloadUrl = apk?.browser_download_url || release.html_url || "";
        if (!updateDownloadUrl) return;

        el.updateMessage.textContent = `目前版本 ${appVersion}，最新版本 ${latestVersion}。`;
        el.updateOverlay.hidden = false;
      } catch (error) {
        // The ordering app remains fully usable while offline.
      }
    }

    async function openUpdateDownload() {
      if (!updateDownloadUrl) return;

      try {
        const browserPlugin = window.Capacitor?.Plugins?.Browser;
        if (browserPlugin?.open) {
          await browserPlugin.open({ url: updateDownloadUrl });
          return;
        }
      } catch (error) {
        // Fall back to a regular browser tab.
      }

      window.open(updateDownloadUrl, "_blank", "noopener");
    }

    function money(value) {
      return `$${value}`;
    }

    function nowLabel(date = new Date()) {
      return date.toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit" });
    }

    function todayDateInput() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function load() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey));
        if (saved && Array.isArray(saved.orders)) {
          state.orders = saved.orders.map(normalizeOrder);
          state.activeId = saved.activeId || null;
          state.archives = Array.isArray(saved.archives)
            ? saved.archives.map(archive => ({
              ...archive,
              orders: Array.isArray(archive.orders) ? archive.orders.map(normalizeOrder) : []
            }))
            : [];
        }
      } catch (error) {
        state.orders = [];
        state.activeId = null;
        state.archives = [];
      }
    }

    function persist() {
      localStorage.setItem(storageKey, JSON.stringify({
        orders: state.orders,
        activeId: state.activeId,
        archives: state.archives
      }));
    }

    function activeOrder() {
      return state.orders.find(order => order.id === state.activeId) || null;
    }

    function orderTotal(order) {
      return order.items.reduce((sum, item) => sum + item.price * item.qty, 0);
    }

    function orderCount(order) {
      return order.items.reduce((sum, item) => sum + item.qty, 0);
    }

    function itemLabel(item) {
      const currentOption = menu
        .flatMap(group => group.options)
        .find(option => option.key === item.key);
      const name = currentOption?.name || item.name;
      const variant = currentOption?.variant || item.variant;
      return variant ? `${name}（${variant}）` : name;
    }

    function normalizeOrder(order) {
      const paymentMethod = order.paymentMethod === "cash" || order.paymentMethod === "electronic"
        ? order.paymentMethod
        : "";
      return {
        ...order,
        paymentMethod,
        paid: Boolean(paymentMethod) || order.status === "done"
      };
    }

    function isPaid(order) {
      return Boolean(order.paymentMethod) || order.status === "done";
    }

    function paymentLabel(order) {
      if (order.paymentMethod === "cash") return "現金";
      if (order.paymentMethod === "electronic") return "電子支付";
      return isPaid(order) ? "已付款" : "未付款";
    }

    function paymentTotals(orders) {
      return orders.reduce((totals, order) => {
        const total = orderTotal(order);
        totals.total += total;
        if (order.paymentMethod === "cash") {
          totals.cash += total;
        } else if (order.paymentMethod === "electronic") {
          totals.electronic += total;
        } else if (isPaid(order)) {
          totals.unknown += total;
        } else {
          totals.unpaid += total;
        }
        return totals;
      }, { total: 0, cash: 0, electronic: 0, unknown: 0, unpaid: 0 });
    }

    function htmlCell(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function fileSafeName(value) {
      return String(value || "封存紀錄")
        .trim()
        .replace(/[\\/:*?"<>|]+/g, "-")
        .replace(/\s+/g, "-")
        .slice(0, 60) || "封存紀錄";
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(",")[1] || "");
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function shareWithCapacitor(filename, blob) {
      const filesystem = window.Capacitor?.Plugins?.Filesystem;
      const share = window.Capacitor?.Plugins?.Share;
      if (!filesystem?.writeFile || !filesystem?.getUri || !share?.share) return false;

      const path = `exports/${Date.now()}-${filename}`;
      const data = await blobToBase64(blob);
      await filesystem.writeFile({
        path,
        data,
        directory: "CACHE",
        recursive: true
      });
      const uri = await filesystem.getUri({
        path,
        directory: "CACHE"
      });
      await share.share({
        title: filename,
        text: filename,
        url: uri.uri,
        dialogTitle: "匯出 Excel"
      });
      return true;
    }

    async function downloadFile(filename, content, type) {
      const blob = new Blob([content], { type });
      if (await shareWithCapacitor(filename, blob)) return;

      const file = new File([blob], filename, { type });

      if (navigator.canShare?.({ files: [file] })) {
        await navigator.share({
          files: [file],
          title: filename
        });
        return;
      }

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function archiveRows(archives) {
      const rows = [];
      archives.forEach(archive => {
        archive.orders.forEach(order => {
          if (!order.items.length) {
            rows.push([
              archive.date,
              order.name,
              nowLabel(new Date(order.createdAt)),
              paymentLabel(order),
              "尚未加入餐點",
              0,
              0,
              0,
              orderTotal(order)
            ]);
            return;
          }

          order.items.forEach(item => {
            rows.push([
              archive.date,
              order.name,
              nowLabel(new Date(order.createdAt)),
              paymentLabel(order),
              itemLabel(item),
              item.price,
              item.qty,
              item.price * item.qty,
              orderTotal(order)
            ]);
          });
        });
      });
      return rows;
    }

    async function exportArchives(archives, filename) {
      if (!archives.length) return;

      const orders = archives.flatMap(archive => archive.orders);
      const totals = paymentTotals(orders);
      const totalItems = orders.reduce((sum, order) => sum + orderCount(order), 0);
      const tableRows = [
        ["封存筆數", archives.length],
        ["訂單筆數", orders.length],
        ["餐點總份數", totalItems],
        ["總金額", totals.total],
        ["現金金額", totals.cash],
        ["電子支付金額", totals.electronic],
        ["舊資料已付款金額", totals.unknown],
        [],
        ["封存日期", "訂單", "時間", "付款方式", "餐點", "單價", "數量", "小計", "訂單合計"],
        ...archiveRows(archives)
      ].map(row => `
        <tr>${row.map(cell => `<td>${htmlCell(cell)}</td>`).join("")}</tr>
      `).join("");

      const workbook = `<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    table { border-collapse: collapse; font-family: "Microsoft JhengHei", Arial, sans-serif; }
    td { border: 1px solid #999; padding: 6px 10px; mso-number-format: "\\@"; }
  </style>
</head>
<body>
  <table>${tableRows}</table>
</body>
</html>`;

      try {
        await downloadFile(
          filename,
          workbook,
          "application/vnd.ms-excel;charset=utf-8"
        );
      } catch (error) {
        window.alert("匯出失敗，請再試一次。");
      }
    }

    function exportArchive(id) {
      const archive = state.archives.find(row => row.id === id);
      if (!archive) return;
      exportArchives([archive], `${fileSafeName(archive.date)}-封存紀錄.xls`);
    }

    function exportAllArchives() {
      const sorted = [...state.archives].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      exportArchives(sorted, "全部封存紀錄.xls");
    }

    function statusLabel(order) {
      if (order.status === "done") return paymentLabel(order);
      if (order.status === "served") return "已給餐";
      if (order.status === "draft") return "點餐中";
      return "待出餐";
    }

    function pendingOrders() {
      return state.orders
        .filter(order => order.status === "open" || order.status === "served")
        .sort((a, b) => new Date(a.submittedAt || a.createdAt) - new Date(b.submittedAt || b.createdAt));
    }

    function historyOrders() {
      return state.orders
        .filter(order => order.status === "done")
        .sort((a, b) => new Date(b.updatedAt || b.createdAt) - new Date(a.updatedAt || a.createdAt));
    }

    function nextOrderName() {
      const maxNumber = state.orders.reduce((max, order) => {
        const match = /^客人 (\d+)$/.exec(order.name);
        return match ? Math.max(max, Number(match[1])) : max;
      }, 0);
      return `客人 ${maxNumber + 1}`;
    }

    function createOrder() {
      const order = {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        name: nextOrderName(),
        items: [],
        status: "draft",
        paid: false,
        paymentMethod: "",
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
      state.orders.push(order);
      state.activeId = order.id;
      persist();
      render();
    }

    function addItem(option) {
      let order = activeOrder();
      if (!order || order.status === "done") {
        createOrder();
        order = activeOrder();
      }

      const existing = order.items.find(item => item.key === option.key);
      if (existing) {
        existing.qty += 1;
      } else {
        order.items.push({ ...option, qty: 1 });
      }
      order.updatedAt = new Date().toISOString();
      persist();
      render();
    }

    function updateQty(key, delta) {
      const order = activeOrder();
      if (!order) return;
      const item = order.items.find(row => row.key === key);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) {
        order.items = order.items.filter(row => row.key !== key);
      }
      order.updatedAt = new Date().toISOString();
      persist();
      render();
    }

    function markServed() {
      const order = activeOrder();
      if (!order || order.items.length === 0 || order.status !== "open") return;
      order.servedAt = new Date().toISOString();
      order.status = isPaid(order) ? "done" : "served";
      order.updatedAt = new Date().toISOString();
      state.activeId = state.orders.find(row => row.status === "draft")?.id || null;
      persist();
      render();
    }

    function setPaymentMethod(id, method) {
      const order = state.orders.find(row => row.id === id);
      if (!order || order.status === "done") return;
      if (method !== "cash" && method !== "electronic") return;
      order.paymentMethod = method;
      order.paid = true;
      order.paidAt = order.paidAt || new Date().toISOString();
      if (order.status === "served") order.status = "done";
      order.updatedAt = new Date().toISOString();
      if (order.status === "done" && state.activeId === order.id) {
        state.activeId = state.orders.find(row => row.status === "draft")?.id || null;
      }
      persist();
      render();
    }

    function submitActiveOrder() {
      const order = activeOrder();
      if (!order || order.items.length === 0) return;
      if (order.status === "done") return;
      order.status = "open";
      delete order.servedAt;
      order.submittedAt = order.submittedAt || new Date().toISOString();
      order.updatedAt = new Date().toISOString();
      state.tab = "open";
      state.activeId = null;
      persist();
      render();
    }

    function removeOrder(id) {
      state.orders = state.orders.filter(order => order.id !== id);
      if (state.activeId === id) {
        state.activeId = state.orders.find(order => order.status === "draft")?.id || null;
      }
      persist();
      render();
    }

    function confirmPendingRemoval(id) {
      const order = state.orders.find(row => row.id === id);
      if (!order || (order.status !== "open" && order.status !== "served")) return;
      const firstConfirmed = window.confirm(`要刪除 ${order.name} 的待出餐訂單嗎？金額 ${money(orderTotal(order))}。`);
      if (!firstConfirmed) return;
      const secondConfirmed = window.confirm(`再次確認：確定永久刪除 ${order.name}？刪除後無法復原。`);
      if (!secondConfirmed) return;
      removeOrder(id);
    }

    function reopenOrder(id) {
      const order = state.orders.find(row => row.id === id);
      if (!order) return;
      order.status = "open";
      order.paid = false;
      order.paymentMethod = "";
      delete order.servedAt;
      delete order.paidAt;
      order.submittedAt = order.submittedAt || new Date().toISOString();
      order.updatedAt = new Date().toISOString();
      state.activeId = order.id;
      state.tab = "open";
      persist();
      render();
    }

    function clearActiveOrder() {
      const order = activeOrder();
      if (!order) return;
      if (order.status === "draft") {
        removeOrder(order.id);
        return;
      }
      order.items = [];
      order.updatedAt = new Date().toISOString();
      persist();
      render();
    }

    function clearAll() {
      if (!state.orders.length) return;
      const confirmed = window.confirm("要清空所有點餐紀錄嗎？");
      if (!confirmed) return;
      state.orders = [];
      state.activeId = null;
      persist();
      render();
    }

    function renumberDraftOrders() {
      let nextNumber = state.orders
        .filter(order => order.status !== "draft")
        .reduce((max, order) => {
          const match = /^客人 (\d+)$/.exec(order.name);
          return match ? Math.max(max, Number(match[1])) : max;
        }, 0);
      state.orders
        .filter(order => order.status === "draft")
        .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt))
        .forEach(order => {
          nextNumber += 1;
          order.name = `客人 ${nextNumber}`;
          order.updatedAt = new Date().toISOString();
        });
    }

    function removeHistoryOrders(history) {
      const historyIds = new Set(history.map(order => order.id));
      state.orders = state.orders.filter(order => !historyIds.has(order.id));
      renumberDraftOrders();
      if (historyIds.has(state.activeId)) state.activeId = null;
    }

    function clearHistory() {
      const history = historyOrders();
      if (!history.length) return;
      const confirmed = window.confirm(`要清除全部 ${history.length} 筆歷史紀錄嗎？待出餐訂單不會被刪除。`);
      if (!confirmed) return;
      removeHistoryOrders(history);
      persist();
      render();
    }

    function archiveHistory() {
      const history = historyOrders();
      if (!history.length) return;
      const input = window.prompt("要將目前的歷史紀錄保存成哪一天？", todayDateInput());
      if (input === null) return;
      const dateLabel = input.trim() || todayDateInput();
      const archive = {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        date: dateLabel,
        createdAt: new Date().toISOString(),
        orders: JSON.parse(JSON.stringify(history))
      };
      state.archives.push(archive);
      removeHistoryOrders(history);
      persist();
      render();
    }

    function removeArchive(id) {
      const archive = state.archives.find(row => row.id === id);
      if (!archive) return;
      const confirmed = window.confirm(`要刪除 ${archive.date} 的封存紀錄嗎？刪除後無法復原。`);
      if (!confirmed) return;
      state.archives = state.archives.filter(row => row.id !== id);
      persist();
      render();
    }

    function editArchiveDate(id) {
      const archive = state.archives.find(row => row.id === id);
      if (!archive) return;
      const input = window.prompt("要修改成哪一天？", archive.date);
      if (input === null) return;
      const dateLabel = input.trim();
      if (!dateLabel || dateLabel === archive.date) return;
      archive.date = dateLabel;
      persist();
      render();
    }

    function renderMenu() {
      el.menu.innerHTML = menu.map(group => `
        <section class="menu-card ${group.wide ? "wide" : ""}">
          <div class="menu-title">
            <h2>${group.title}</h2>
          </div>
          <div class="option-grid">
            ${group.options.map(option => `
              <button class="option-btn" type="button" data-add="${option.key}">
                <strong>${option.variant || option.name}</strong>
                <span>${money(option.price)}</span>
              </button>
            `).join("")}
          </div>
        </section>
      `).join("");
    }

    function renderCurrentOrder() {
      const order = activeOrder();
      if (!order) {
        el.activeCustomer.textContent = "尚未選擇";
        el.items.innerHTML = "";
        el.total.textContent = money(0);
        el.doneBtn.disabled = true;
        el.doneBtn.textContent = "送出待出餐";
        el.saveBtn.disabled = true;
        return;
      }

      el.activeCustomer.textContent = order.name;
      el.total.textContent = money(orderTotal(order));
      el.doneBtn.disabled = order.items.length === 0 || order.status === "done";
      el.doneBtn.textContent = order.status === "draft" ? "送出待出餐" : "更新待出餐";
      el.saveBtn.disabled = order.status === "done";

      if (!order.items.length) {
        el.items.innerHTML = `<div class="empty">尚未加入餐點。</div>`;
        return;
      }

      el.items.innerHTML = order.items.map(item => `
        <div class="line-item">
          <div>
            <div class="line-name">${itemLabel(item)}</div>
            <div class="line-meta">${money(item.price)} / 份</div>
          </div>
          <div class="qty-control" aria-label="${itemLabel(item)} 數量">
            <button class="qty-btn" type="button" data-qty="${item.key}" data-delta="-1">−</button>
            <div class="qty">${item.qty}</div>
            <button class="qty-btn" type="button" data-qty="${item.key}" data-delta="1">＋</button>
          </div>
          <div class="item-total">${money(item.price * item.qty)}</div>
        </div>
      `).join("");
    }

    function renderRecords() {
      const source = historyOrders();
      const totals = paymentTotals(source);
      const totalItems = source.reduce((sum, order) => sum + orderCount(order), 0);
      const itemCounts = new Map();

      source.forEach(order => {
        order.items.forEach(item => {
          const label = itemLabel(item);
          itemCounts.set(label, (itemCounts.get(label) || 0) + item.qty);
        });
      });

      el.openTab.classList.toggle("active", state.tab === "open");
      el.historyTab.classList.toggle("active", state.tab === "history");
      el.archiveTab.classList.toggle("active", state.tab === "archive");
      el.records.style.display = state.tab === "history" ? "grid" : "none";

      if (!source.length) {
        el.records.innerHTML = `<div class="empty">目前沒有歷史紀錄。</div>`;
        return;
      }

      el.records.innerHTML = `
        <section class="history-summary" aria-label="歷史紀錄統計">
          <div class="history-summary-top">
            <div>
              <div class="history-summary-label">歷史總金額</div>
              <div class="history-summary-total">${money(totals.total)}</div>
            </div>
            <div class="history-summary-meta">${source.length} 筆訂單 · ${totalItems} 份餐點</div>
          </div>
          <div class="history-item-counts">
            <div class="history-item-count">
              <span>現金</span>
              <strong>${money(totals.cash)}</strong>
            </div>
            <div class="history-item-count">
              <span>電子支付</span>
              <strong>${money(totals.electronic)}</strong>
            </div>
            ${totals.unknown ? `
              <div class="history-item-count">
                <span>舊資料已付款</span>
                <strong>${money(totals.unknown)}</strong>
              </div>
            ` : ""}
          </div>
          <div class="history-item-counts">
            ${[...itemCounts.entries()]
              .sort(([left], [right]) => left.localeCompare(right, "zh-TW"))
              .map(([label, count]) => `
                <div class="history-item-count">
                  <span>${label}</span>
                  <strong>${count} 份</strong>
                </div>
              `).join("")}
          </div>
          <div class="history-summary-actions">
            <button class="archive-btn" type="button" data-archive-history>封存為日期</button>
            <button class="clear-history-btn" type="button" data-clear-history>清除全部</button>
          </div>
        </section>
        ${source.map(order => `
        <article class="record">
          <div class="record-main">
            <div>
              <div class="record-name">${order.name}</div>
              <div class="record-time">${nowLabel(new Date(order.createdAt))} · ${paymentLabel(order)}</div>
            </div>
            <span class="status ${order.status}">${statusLabel(order)}</span>
          </div>
          <div class="record-lines">
            ${order.items.length ? order.items.map(item => `${itemLabel(item)} × ${item.qty}`).join("、") : "尚未加入餐點"}
          </div>
          <div class="record-bottom">
            <div class="record-total">${money(orderTotal(order))}</div>
            <div class="record-buttons">
              <button class="secondary-btn" type="button" data-select="${order.id}">查看</button>
              <button class="secondary-btn" type="button" data-reopen="${order.id}">恢復</button>
              <button class="danger-btn" type="button" data-remove="${order.id}">刪除</button>
            </div>
          </div>
        </article>
        `).join("")}
      `;
    }

    function renderArchives() {
      el.archives.style.display = state.tab === "archive" ? "grid" : "none";

      if (!state.archives.length) {
        el.archives.innerHTML = `<div class="empty">目前沒有封存紀錄。在歷史紀錄分頁點擊「封存為日期」即可保存。</div>`;
        return;
      }

      const sorted = [...state.archives].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      const archivedOrders = state.archives.flatMap(archive => archive.orders);
      const archivedTotals = paymentTotals(archivedOrders);
      const archivedOrderCount = state.archives.reduce((sum, archive) => sum + archive.orders.length, 0);
      const archivedItemCount = state.archives.reduce((sum, archive) => {
        return sum + archive.orders.reduce((orderSum, order) => orderSum + orderCount(order), 0);
      }, 0);

      el.archives.innerHTML = `
        <section class="history-summary" aria-label="封存紀錄操作">
          <div class="history-summary-top">
            <div>
              <div class="history-summary-label">全部封存紀錄</div>
              <div class="history-summary-total">${money(archivedTotals.total)}</div>
            </div>
            <div class="history-summary-meta">${archivedOrderCount} 筆訂單 · ${archivedItemCount} 份餐點</div>
          </div>
          <div class="history-item-counts">
            <div class="history-item-count">
              <span>現金</span>
              <strong>${money(archivedTotals.cash)}</strong>
            </div>
            <div class="history-item-count">
              <span>電子支付</span>
              <strong>${money(archivedTotals.electronic)}</strong>
            </div>
            ${archivedTotals.unknown ? `
              <div class="history-item-count">
                <span>舊資料已付款</span>
                <strong>${money(archivedTotals.unknown)}</strong>
              </div>
            ` : ""}
          </div>
          <div class="history-summary-actions">
            <button class="archive-btn" type="button" data-export-all-archives>匯出全部 Excel</button>
          </div>
        </section>
        ${sorted.map(archive => {
        const archiveTotals = paymentTotals(archive.orders);
        const totalItems = archive.orders.reduce((sum, order) => sum + orderCount(order), 0);
        const itemCounts = new Map();

        archive.orders.forEach(order => {
          order.items.forEach(item => {
            const label = itemLabel(item);
            itemCounts.set(label, (itemCounts.get(label) || 0) + item.qty);
          });
        });

        return `
        <article class="record" aria-label="封存紀錄 ${archive.date}">
          <div class="record-main">
            <div>
              <div class="record-name">${archive.date}</div>
              <div class="record-time">${archive.orders.length} 筆訂單 · ${totalItems} 份餐點</div>
            </div>
            <div class="record-total">${money(archiveTotals.total)}</div>
          </div>
          <div class="history-item-counts">
            <div class="history-item-count">
              <span>現金</span>
              <strong>${money(archiveTotals.cash)}</strong>
            </div>
            <div class="history-item-count">
              <span>電子支付</span>
              <strong>${money(archiveTotals.electronic)}</strong>
            </div>
            ${archiveTotals.unknown ? `
              <div class="history-item-count">
                <span>舊資料已付款</span>
                <strong>${money(archiveTotals.unknown)}</strong>
              </div>
            ` : ""}
          </div>
          <div class="history-item-counts">
            ${[...itemCounts.entries()]
              .sort(([left], [right]) => left.localeCompare(right, "zh-TW"))
              .map(([label, count]) => `
                <div class="history-item-count">
                  <span>${label}</span>
                  <strong>${count} 份</strong>
                </div>
              `).join("")}
          </div>
          <div class="record-bottom">
            <div></div>
            <div class="record-buttons">
              <button class="secondary-btn" type="button" data-export-archive="${archive.id}">匯出 Excel</button>
              <button class="secondary-btn" type="button" data-edit-archive="${archive.id}">修改日期</button>
              <button class="danger-btn" type="button" data-remove-archive="${archive.id}">刪除封存</button>
            </div>
          </div>
        </article>
        `;
      }).join("")}
      `;
    }

    function renderPendingOrders() {
      const pending = pendingOrders();
      const totalItems = pending.reduce((sum, order) => sum + orderCount(order), 0);
      const unpaidTotal = pending
        .filter(order => !isPaid(order))
        .reduce((sum, order) => sum + orderTotal(order), 0);

      el.pendingCount.textContent = `${pending.length} 筆`;
      el.pendingItemsCount.textContent = `${totalItems} 份餐點`;
      el.pendingTotalText.textContent = pending.length
        ? `未付款合計 ${money(unpaidTotal)}`
        : "目前沒有未給餐訂單";
      el.pendingList.style.display = state.tab === "open" ? "grid" : "none";

      if (!pending.length) {
        el.pendingList.innerHTML = `<div class="empty">沒有待出餐。右側點完餐並送出後才會顯示在這裡。</div>`;
        return;
      }

      el.pendingList.innerHTML = pending.map(order => `
        <article class="pending-card ${order.id === state.activeId ? "active" : ""}">
          <div class="pending-card-head">
            <div>
              <div class="pending-name">${order.name}</div>
              <div class="pending-time">${nowLabel(new Date(order.createdAt))} · ${orderCount(order)} 份</div>
            </div>
            <span class="status ${order.status}">${statusLabel(order)}</span>
          </div>
          <div class="pending-lines">
            ${order.items.length
              ? order.items.map(item => `
                <div class="pending-line">
                  <span>${itemLabel(item)}</span>
                  <span>× ${item.qty}</span>
                </div>
              `).join("")
              : `<div class="pending-line"><span>尚未加入餐點</span><span>× 0</span></div>`}
          </div>
          <div class="pending-card-actions">
            <div class="pending-total">${money(orderTotal(order))}</div>
            <div class="pending-buttons">
              <div class="pending-button-group">
                <button class="secondary-btn" type="button" data-select-pending="${order.id}">編輯</button>
                <button class="danger-btn" type="button" data-remove-pending="${order.id}">刪除</button>
              </div>
              <div class="pending-button-group payments">
                <button class="${order.paymentMethod === "cash" ? "success-btn" : "secondary-btn"}" type="button" data-payment-pending="${order.id}" data-payment-method="cash">現金</button>
                <button class="${order.paymentMethod === "electronic" ? "success-btn" : "secondary-btn"}" type="button" data-payment-pending="${order.id}" data-payment-method="electronic">電子支付</button>
                <button class="primary-btn" type="button" data-complete-pending="${order.id}" ${order.items.length && order.status === "open" ? "" : "disabled"}>${order.status === "served" ? "已給餐" : "完成"}</button>
              </div>
            </div>
          </div>
        </article>
      `).join("");
    }

    function render() {
      renderPendingOrders();
      renderCurrentOrder();
      renderRecords();
      renderArchives();
    }

    renderMenu();
    load();
    render();
    checkForUpdates();

    el.menu.addEventListener("click", event => {
      const button = event.target.closest("[data-add]");
      if (!button) return;
      const option = menu.flatMap(group => group.options).find(row => row.key === button.dataset.add);
      if (option) addItem(option);
    });

    el.items.addEventListener("click", event => {
      const button = event.target.closest("[data-qty]");
      if (!button) return;
      updateQty(button.dataset.qty, Number(button.dataset.delta));
    });

    el.records.addEventListener("click", event => {
      const select = event.target.closest("[data-select]");
      const reopen = event.target.closest("[data-reopen]");
      const remove = event.target.closest("[data-remove]");
      const archiveHistoryBtn = event.target.closest("[data-archive-history]");
      const clearHistoryBtn = event.target.closest("[data-clear-history]");

      if (archiveHistoryBtn) {
        archiveHistory();
        return;
      }
      if (clearHistoryBtn) {
        clearHistory();
        return;
      }
      if (select) state.activeId = select.dataset.select;
      if (reopen) {
        reopenOrder(reopen.dataset.reopen);
        return;
      }
      if (remove) {
        removeOrder(remove.dataset.remove);
        return;
      }
      persist();
      render();
    });

    el.archives.addEventListener("click", event => {
      const exportAllButton = event.target.closest("[data-export-all-archives]");
      const exportButton = event.target.closest("[data-export-archive]");
      const edit = event.target.closest("[data-edit-archive]");
      const remove = event.target.closest("[data-remove-archive]");
      if (exportAllButton) {
        exportAllArchives();
        return;
      }
      if (exportButton) {
        exportArchive(exportButton.dataset.exportArchive);
        return;
      }
      if (edit) {
        editArchiveDate(edit.dataset.editArchive);
        return;
      }
      if (remove) removeArchive(remove.dataset.removeArchive);
    });

    el.pendingList.addEventListener("click", event => {
      const select = event.target.closest("[data-select-pending]");
      const complete = event.target.closest("[data-complete-pending]");
      const payment = event.target.closest("[data-payment-pending]");
      const remove = event.target.closest("[data-remove-pending]");

      if (select) {
        state.activeId = select.dataset.selectPending;
        persist();
        render();
        return;
      }

      if (complete) {
        state.activeId = complete.dataset.completePending;
        markServed();
        return;
      }

      if (payment) {
        setPaymentMethod(payment.dataset.paymentPending, payment.dataset.paymentMethod);
        return;
      }

      if (remove) {
        confirmPendingRemoval(remove.dataset.removePending);
      }
    });

    el.openTab.addEventListener("click", () => {
      state.tab = "open";
      renderPendingOrders();
      renderRecords();
      renderArchives();
    });

    el.historyTab.addEventListener("click", () => {
      state.tab = "history";
      renderPendingOrders();
      renderRecords();
      renderArchives();
    });

    el.archiveTab.addEventListener("click", () => {
      state.tab = "archive";
      renderPendingOrders();
      renderRecords();
      renderArchives();
    });

    el.saveBtn.addEventListener("click", clearActiveOrder);

    el.doneBtn.addEventListener("click", submitActiveOrder);
    el.clearAllBtn.addEventListener("click", clearAll);
    el.updateLaterBtn.addEventListener("click", () => {
      el.updateOverlay.hidden = true;
    });
    el.updateNowBtn.addEventListener("click", openUpdateDownload);

    document.addEventListener("visibilitychange", () => {
      const oneHour = 60 * 60 * 1000;
      if (!document.hidden && Date.now() - lastUpdateCheck > oneHour) {
        checkForUpdates();
      }
    });
  </script>
</body>
</html>
